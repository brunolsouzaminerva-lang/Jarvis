name: Testes GGO
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias dos testes sinteticos de voz
        run: python -m pip install -r requirements-test-voz.txt
      - name: PowerShell disponivel para testes de integracao sinteticos
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - name: Testes unitarios
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
